version: '3.8'

services:
  backend:
    build: .
    image: zhiyi-backend:latest
    container_name: zhiyi-backend
    restart: unless-stopped
    ports:
      # 主机 3300 → 容器 8000，与 install.sh 的默认端口保持一致
      - "3300:8000"
    env_file:
      - .env
    environment:
      ZHIYI_DB: /app/data/zhiyi.db
      ZHIYI_TOKEN_KEY_FILE: /app/data/token-key.json
      ZHIYI_CODE_RUNNER: disabled
    volumes:
      - zhiyi-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  zhiyi-data:
