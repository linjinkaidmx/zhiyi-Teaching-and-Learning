<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知一 · AI 拍题讲解 + 错题自测</title>
    <link rel="stylesheet" href="/hljs_github.min.css" />
    <link rel="stylesheet" href="/cm/cm0.min.css" />
    <script>
      /* 主题要在首帧之前定下来：否则开屏层会先按浅色画一遍再翻深色（闪一下） */
      (function () {
        try {
          var p = new URLSearchParams(location.search).get('theme')
          var t = p || localStorage.getItem('zy_theme') || 'light'
          document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <style>
      /* ==========================================================================
         开场动画层（zy-boot）· 2026-10-13 v2
         ---------------------------------------------------------------------------
         必须内联：它要在「JS 还没下载完」时就可见，用来盖住首屏加载的空白期。
         v2：
           · 中央图形换成正式品牌 logo（块面 Z + 循环箭头环，与参赛海报同款）
           · 循环箭头环做 0.55s 描边生长动画（呼应「从一道错题，到一个闭环」）
           · 画面放大（图形 96px / 名称 34px）；背景加品牌径向柔光，暗色改深紫
           · 退场：整组上移 + 微放大 + 渐隐，与首页 is-enter 级联衔接
           · 慢网络：进度线 + 一句话；兜底上限 10s → 5s
         ========================================================================== */
      .zy-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 62% 46% at 50% 40%, rgba(124, 92, 255, 0.10), transparent 70%),
          linear-gradient(160deg, #eef3fd 0%, #f4f0fd 52%, #fdf5ee 100%);
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      html[data-theme='dark'] .zy-boot {
        background:
          radial-gradient(ellipse 62% 46% at 50% 40%, rgba(124, 92, 255, 0.16), transparent 70%),
          linear-gradient(160deg, #0d1020 0%, #141326 52%, #191426 100%);
      }
      .zy-boot.is-out {
        opacity: 0;
        visibility: hidden;
      }
      .zy-boot__inner {
        display: flex;
        align-items: center;
        gap: 22px;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      }
      /* 退场：整组上移 + 微放大（比整层硬渐隐多一层「让位」的动势） */
      .zy-boot.is-out .zy-boot__inner {
        transform: translateY(-14px) scale(1.045);
        opacity: 0;
      }
      .zy-boot__mark {
        width: 96px;
        height: 96px;
        flex: none;
        opacity: 0;
        animation: zyBootMark 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        filter: drop-shadow(0 14px 28px rgba(91, 71, 214, 0.32));
      }
      .zy-boot__mark svg {
        width: 100%;
        height: 100%;
      }
      /* 循环箭头环：描边生长（pathLength=100 归一化，环画完正好「扣」进箭头） */
      .zy-boot__ring {
        stroke-dasharray: 100;
        stroke-dashoffset: 0;
        animation: zyBootRing 0.55s cubic-bezier(0.3, 0, 0.2, 1) both;
      }
      /* 块面 Z：跟在环后面、从 0.94 轻放大进场 */
      .zy-boot__zg {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: zyBootZ 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
      }
      .zy-boot__text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      .zy-boot__name {
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #141a26;
        opacity: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        animation: zyBootName 0.32s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
      }
      .zy-boot__slogan {
        font-size: 13px;
        letter-spacing: 0.14em;
        color: #7c869b;
        opacity: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        animation: zyBootSlogan 0.32s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both;
      }
      html[data-theme='dark'] .zy-boot__name {
        color: #eceef6;
      }
      html[data-theme='dark'] .zy-boot__slogan {
        color: #8d94ab;
      }
      /* 慢网络反馈：进度线 + 一句话（脚本 >1.1s 时给层加 is-slow；配合下方呼吸） */
      .zy-boot__slow {
        position: absolute;
        left: 50%;
        bottom: 17vh;
        transform: translateX(-50%);
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        opacity: 0;
        animation: zyBootSlogan 0.32s ease both;
      }
      .zy-boot.is-slow .zy-boot__slow {
        display: flex;
      }
      .zy-boot__bar {
        width: 168px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(124, 92, 255, 0.18);
      }
      .zy-boot__bar i {
        display: block;
        width: 44px;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(154, 123, 255, 0.55), #7c5cff);
        animation: zyBootBar 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .zy-boot__slowtext {
        font-size: 12px;
        letter-spacing: 0.08em;
        color: #7c869b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      html[data-theme='dark'] .zy-boot__slowtext {
        color: #8d94ab;
      }
      /* 慢网络（Vue 迟迟不就绪）：Logo 轻微呼吸，诚实表达「正在加载」 */
      .zy-boot.is-slow .zy-boot__mark {
        animation: zyBootMark 0.45s cubic-bezier(0.16, 1, 0.3, 1) both,
          zyBootBreathe 1.7s ease-in-out 1.1s infinite;
      }
      @keyframes zyBootMark {
        from { opacity: 0; transform: translateY(12px) scale(0.92); }
        to { opacity: 1; transform: none; }
      }
      @keyframes zyBootRing {
        from { stroke-dashoffset: 100; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes zyBootZ {
        from { opacity: 0; transform: scale(0.94); }
        to { opacity: 1; transform: none; }
      }
      @keyframes zyBootName {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes zyBootSlogan {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes zyBootBreathe {
        0%, 100% { opacity: 0.58; }
        50% { opacity: 1; }
      }
      @keyframes zyBootBar {
        from { transform: translateX(-48px); }
        to { transform: translateX(172px); }
      }
      @media (max-width: 640px) {
        .zy-boot__inner { gap: 16px; }
        .zy-boot__mark { width: min(96px, 21vw); height: min(96px, 21vw); }
        .zy-boot__name { font-size: min(34px, 8vw); }
        .zy-boot__slogan { font-size: 12px; }
        .zy-boot__slow { bottom: 14vh; }
      }
      @media (prefers-reduced-motion: reduce) {
        .zy-boot__mark, .zy-boot__zg, .zy-boot__name, .zy-boot__slogan, .zy-boot__slow { animation: none !important; opacity: 1; }
        .zy-boot__ring, .zy-boot__bar i { animation: none !important; }
        .zy-boot__inner { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- 开场动画：正式品牌 logo（块面 Z + 循环箭头环，与参赛海报同款）+ 字标 -->
    <div id="zyBoot" class="zy-boot" aria-hidden="true">
      <div class="zy-boot__inner">
        <div class="zy-boot__mark">
          <!-- 循环箭头环 pathLength=100 归一化，配合 CSS 做描边生长；箭头在缺口处等环画完「扣」上 -->
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="zyBootZg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#9A7BFF"/>
                <stop offset="1" stop-color="#5F3FE0"/>
              </linearGradient>
              <marker id="zyBootArr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
                <path d="M1 1L9 5L1 9" fill="none" stroke="#A995FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </marker>
            </defs>
            <path class="zy-boot__ring" d="M89.5 35.6 A42 42 0 1 1 57.3 8.6" fill="none" stroke="#A995FF" stroke-width="8.5" stroke-linecap="round" marker-end="url(#zyBootArr)" pathLength="100"/>
            <path class="zy-boot__zg" d="M30 36 L70 36 L70 45 L44 55 L70 55 L70 64 L30 64 L30 55 L56 45 L30 45 Z" fill="url(#zyBootZg)"/>
          </svg>
        </div>
        <div class="zy-boot__text">
          <div class="zy-boot__name">知一</div>
          <div class="zy-boot__slogan">知理于一，笃学前行</div>
        </div>
      </div>
      <!-- 慢网络反馈：进度线 + 一句话（脚本在 >1.1s 时给层加 is-slow） -->
      <div class="zy-boot__slow">
        <div class="zy-boot__bar"><i></i></div>
        <span class="zy-boot__slowtext">正在准备你的学习搭子…</span>
      </div>
    </div>

    <script>
      /* ==========================================================================
         开场动画控制
         ---------------------------------------------------------------------------
         显示条件（三者都满足）：首页 + 系统未开「减少动效」+ 本会话未播过
         标记在解析阶段就写入 sessionStorage，因此刷新/站内跳转不会重播。
         交接条件：动画播完（1.0s）且 Vue 已就绪；慢网络时保持常亮（呼吸 + 进度线）。
         兜底：最长 5 秒强制结束，避免脚本异常时永远挡屏。
         ========================================================================== */
      (function () {
        var MIN_SHOW = 1000 // 开屏层最短展示时间（环 0.55s + 文字到 0.87s，留一拍再退场）
        // 兜底上限：只在「Vue 已就绪但交接卡住」这类异常时才需要；
        // 若把上限设得过短，慢网络下会出现「开屏层先撤、页面还没好」的白窗。
        // 5s 足够覆盖正常加载，且不会让用户干等 —— 超时后进度线仍在（层移除后由页面自身骨架接手）。
        var MAX_SHOW = 5000
        var t0 = Date.now()
        var el = document.getElementById('zyBoot')
        var root = document.documentElement

        function hide(skip) {
          if (!el || el.dataset.done === '1') return
          el.dataset.done = '1'
          el.classList.add('is-out')
          if (skip) root.classList.add('zy-boot-skip')
          root.classList.add('zy-boot-done')
          setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el)
          }, 300)
        }

        var shouldShow = false
        try {
          var p = location.pathname || '/'
          var isHome = p === '/' || p === '/index.html'
          var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          var played = sessionStorage.getItem('zy_boot_played') === '1'
          shouldShow = isHome && !calm && !played
          if (shouldShow) sessionStorage.setItem('zy_boot_played', '1')
        } catch (e) {
          shouldShow = false
        }

        if (!shouldShow) {
          // 直接呈现：不播动画，也不给首页加级联
          root.classList.add('zy-boot-skip', 'zy-boot-done')
          if (el && el.parentNode) el.parentNode.removeChild(el)
          return
        }

        // 慢网络提示：1.1s 后 Vue 还没就绪 → Logo 呼吸
        var slowTimer = setTimeout(function () {
          if (el && el.dataset.done !== '1') el.classList.add('is-slow')
        }, 1100)

        var maxTimer = setTimeout(function () { finish(true) }, MAX_SHOW)
        var readyFlag = false

        function finish(skip) {
          clearTimeout(slowTimer)
          clearTimeout(maxTimer)
          hide(skip)
        }

        // 点击 / 任意按键 → 立即跳过
        function onSkip() {
          if (el && el.dataset.done === '1') return
          finish(true)
        }
        el.addEventListener('click', onSkip, { once: true })
        document.addEventListener('keydown', onSkip, { once: true })
        el.addEventListener('touchstart', onSkip, { passive: true, once: true })

        /** Vue 挂载完成时由 src/lib/boot.js 调用：满足最短展示时间后交接 */
        window.__zyBoot = {
          ready: function () {
            if (readyFlag) return
            readyFlag = true
            var elapsed = Date.now() - t0
            if (el && el.dataset.done === '1') return
            if (el) el.classList.remove('is-slow')
            var wait = Math.max(0, MIN_SHOW - elapsed)
            setTimeout(function () { finish(false) }, wait)
          },
        }
      })()
    </script>

    <!-- 代码高亮体积小且被高频文本组件使用，保留；chart / codemirror 约 396KB
         改为用到时由 src/lib/lazyLibs.js 动态注入（首屏不再下载） -->
    <script src="/highlight.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
